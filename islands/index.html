const ferryStops=[new THREE.Vector3(-14,.1,9),new THREE.Vector3(-2,.1,7),new THREE.Vector3(13,.1,8),new THREE.Vector3(18,.1,19)];
function animateLife(ms){if(!lifeEnabled)return;let t=ms/1000;for(let w of walkers){let [a,b]=w.route,dist=a.distanceTo(b),cycle=dist*2/w.speed,phase=((t+w.phase*cycle)%cycle)/cycle,frac=phase<.5?phase*2:2-phase*2;w.g.position.lerpVectors(a,b,frac);w.g.position.y=.71;let direction=new THREE.Vector3().subVectors(phase<.5?b:a,phase<.5?a:b);w.g.rotation.y=Math.atan2(direction.x,direction.z);for(let j=0;j<2;j++)w.legs[j].rotation.x=Math.sin(t*9+w.phase*8+j*Math.PI)*.34}let cycle=96,step=((t%cycle)/cycle)*ferryStops.length,idx=Math.floor(step)%ferryStops.length,k=step-Math.floor(step),a=ferryStops[idx],b=ferryStops[(idx+1)%ferryStops.length];boat.position.lerpVectors(a,b,k);boat.position.y=.06+Math.sin(t*2)*.04;boat.rotation.y=Math.atan2(b.x-a.x,b.z-a.z)}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,flight=null;function fly(target,d=15){flight={start:performance.now(),a:camera.position.clone(),b:new THREE.Vector3(target.x+d*.55,d*.72,target.z+d*.95),ta:controls.target.clone(),tb:target.clone()}}function enter(id){panel(id);fly(centers[id],id==='exam'?15:22)}function home(){panel(null);fly(new THREE.Vector3(1,0,3),65)}function focus(id){let p=targets[id];if(!p)return;let t=all.find(x=>x.id===id);if(active!==t.island)panel(t.island);fly(p,8);setTimeout(()=>{if(document.getElementById('overlay').classList.contains('show'))return;place(id)},850)}app.enter=enter;app.home=home;app.focus=focus;renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];flight=null});renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;let r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);let hit=ray.intersectObjects(clickable,false)[0];if(!hit)return;let id=hit.object.userData.id;if(!id)return;let t=all.find(x=>x.id===id);if(active!==t.island)enter(t.island);else focus(id)});function resize(){camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}addEventListener('resize',resize);let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function loop(now){requestAnimationFrame(loop);if(flight){let k=Math.min(1,(now-flight.start)/(reduce?1:850)),e=k*k*(3-2*k);camera.position.lerpVectors(flight.a,flight.b,e);controls.target.lerpVectors(flight.ta,flight.tb,e);if(k>=1)flight=null}animateLife(now);controls.update();renderer.render(scene,camera)}requestAnimationFrame(loop);$('loading').classList.add('done');$('loading').remove();setTimeout(()=>{try{if(!sessionStorage.getItem('civics-hex-v7-tip')){sessionStorage.setItem('civics-hex-v7-tip','1');tasks()}}catch(e){tasks()}},500)
}catch(err){$('loading')?.remove();$('fallback').classList.add('show');$('fallbackText').textContent='3D場景無法啟動：'+err.message+'。仍可從清單進入各課程。'}
